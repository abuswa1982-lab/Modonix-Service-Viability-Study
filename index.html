<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Service Viability Study</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap">
<style>
:root{
  --ground:#F2F3EF; --surface:#FFFFFF; --surface-2:#F7F8F5; --sunken:#ECEEE9;
  --ink:#1A2126; --ink-2:#39434A; --muted:#5E686E; --faint:#8A9398;
  --line:#D8DCD4; --line-2:#E6E9E2;
  --accent:#1F4E5A; --accent-hover:#173E48; --accent-ink:#FFFFFF; --accent-soft:#E2ECEC;
  --good:#2D7A4E; --warn:#A8660A; --bad:#B03A3A; --info:#2F5E9E;
  --t-verified:#2D7A4E; --t-interview:#2F5E9E; --t-historical:#6A4C9C; --t-competitor:#1F7A7A;
  --t-calculated:#8A6A1C; --t-assumption:#B8601A; --t-unknown:#7A8388;
  --fav-0:#E9ECE6; --fav-1:#E8B7B2; --fav-2:#F1D3CD; --fav-3:#F1E6C8; --fav-4:#CFE5D5; --fav-5:#A9D3B6;
  --shadow:0 1px 2px rgba(20,30,35,.06), 0 4px 16px rgba(20,30,35,.06);
  --radius:6px;
  --font:'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
  --mono:'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --serif:'Source Serif 4', Georgia, 'Times New Roman', serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#101518; --surface:#182024; --surface-2:#1C252A; --sunken:#141B1E;
    --ink:#E4E9E6; --ink-2:#C3CBC8; --muted:#98A3A7; --faint:#6F7A7F;
    --line:#2C363B; --line-2:#242D32;
    --accent:#86BAC4; --accent-hover:#A1CCD4; --accent-ink:#0D1417; --accent-soft:#1D3137;
    --good:#6CC08E; --warn:#E0A547; --bad:#E57D78; --info:#83A9E0;
    --t-verified:#6CC08E; --t-interview:#83A9E0; --t-historical:#B39AE0; --t-competitor:#5EC2C2;
    --t-calculated:#D4B35E; --t-assumption:#E99559; --t-unknown:#98A3A7;
    --fav-0:#222B30; --fav-1:#5C2B2A; --fav-2:#46302D; --fav-3:#45402A; --fav-4:#27463A; --fav-5:#2F5F45;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
    --ground:#101518; --surface:#182024; --surface-2:#1C252A; --sunken:#141B1E;
    --ink:#E4E9E6; --ink-2:#C3CBC8; --muted:#98A3A7; --faint:#6F7A7F;
    --line:#2C363B; --line-2:#242D32;
    --accent:#86BAC4; --accent-hover:#A1CCD4; --accent-ink:#0D1417; --accent-soft:#1D3137;
    --good:#6CC08E; --warn:#E0A547; --bad:#E57D78; --info:#83A9E0;
    --t-verified:#6CC08E; --t-interview:#83A9E0; --t-historical:#B39AE0; --t-competitor:#5EC2C2;
    --t-calculated:#D4B35E; --t-assumption:#E99559; --t-unknown:#98A3A7;
    --fav-0:#222B30; --fav-1:#5C2B2A; --fav-2:#46302D; --fav-3:#45402A; --fav-4:#27463A; --fav-5:#2F5F45;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25);
    color-scheme: dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);font:14px/1.5 var(--font);-webkit-font-smoothing:antialiased}
img{max-width:100%}
[hidden]{display:none!important}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono);font-size:.92em}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.faint{color:var(--faint)}
.small{font-size:12.5px}
.nowrap{white-space:nowrap}

/* ---------- App frame ---------- */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100%}
.side{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--surface);border-right:1px solid var(--line);padding:18px 12px 24px;display:flex;flex-direction:column;gap:18px}
.brand{padding:2px 8px}
.brand .mark{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.brand .name{font-family:var(--serif);font-size:19px;font-weight:600;line-height:1.2;margin-top:2px}
.nav{display:flex;flex-direction:column;gap:1px}
.nav .sec{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);padding:12px 8px 4px}
.nav a{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 8px;border-radius:5px;color:var(--ink-2);text-decoration:none}
.nav a:hover{background:var(--surface-2)}
.nav a.on{background:var(--accent-soft);color:var(--ink);font-weight:500}
.nav a .count{font-family:var(--mono);font-size:11px;color:var(--muted)}
.side-foot{margin-top:auto;padding:0 8px;display:flex;flex-direction:column;gap:6px}
#saveState{font-size:12px;color:var(--muted)}
#saveState[data-state="err"]{color:var(--bad)}
.app > div{min-width:0}
.topbar{display:none}
main{min-width:0;padding-block:22px 64px;padding-inline:32px}
.page{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:20px}

@media (max-width: 860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;inset:0 auto 0 0;width:260px;z-index:40;transform:translateX(-102%);transition:transform .2s;box-shadow:var(--shadow);padding-top:calc(18px + env(safe-area-inset-top,0px))}
  .side.open{transform:none}
  .topbar{display:flex;align-items:center;gap:10px;position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--surface);border-bottom:1px solid var(--line);padding:10px 16px}
  main{padding-inline:16px}
}

/* ---------- Type ---------- */
h1,h2,h3,h4{margin:0;text-wrap:balance}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.title{font-family:var(--serif);font-weight:600;font-size:28px;line-height:1.2}
.subtitle{color:var(--muted);max-width:72ch}
h2.sh{font-size:16px;font-weight:600}
h3.sh{font-size:14px;font-weight:600}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.head .left{display:flex;flex-direction:column;gap:6px;min-width:0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:12px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media (max-width: 900px){.grid2,.grid3{grid-template-columns:1fr}}

/* ---------- Surfaces ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
.panel > .ph{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line-2);flex-wrap:wrap}
.panel > .pb{padding:14px 16px}
.panel.flat{background:var(--surface-2)}
.callout{border-left:3px solid var(--accent);background:var(--accent-soft);padding:10px 14px;border-radius:0 var(--radius) var(--radius) 0}
.callout.warn{border-color:var(--warn);background:color-mix(in srgb, var(--warn) 10%, var(--surface))}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}

/* ---------- Controls ---------- */
.btn{text-decoration:none;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:6px 11px;border-radius:5px;cursor:pointer;white-space:nowrap;line-height:1.3}
.btn:hover{border-color:var(--faint)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:var(--accent-hover)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent)}
.btn.ghost:hover{background:var(--accent-soft)}
.btn.sm{padding:3px 8px;font-size:12.5px}
.btn.danger{color:var(--bad)}
.btn.ev{font-family:var(--mono);font-size:11px;letter-spacing:.04em;padding:3px 7px;color:var(--accent);border-color:color-mix(in srgb,var(--accent) 35%, var(--line))}
.btn.ev.has{background:var(--accent-soft)}
input[type=text],input[type=number],input[type=date],input[type=url],input:not([type]),select,textarea{
  width:100%;background:var(--surface);border:1px solid var(--line);border-radius:5px;padding:6px 9px;min-width:0}
textarea{resize:vertical;min-height:58px;line-height:1.45}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%, transparent)}
select{padding-right:24px}
select.inline{width:auto;padding:3px 22px 3px 7px;font-size:12.5px}
label.lbl{display:block;font-size:12px;font-weight:500;color:var(--ink-2);margin-bottom:4px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.form .wide{grid-column:1/-1}
.search{max-width:280px}

/* ---------- Chips & badges ---------- */
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;padding:1px 8px;border-radius:999px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink-2);white-space:nowrap;line-height:1.6}
.chip .dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:1px 7px;border-radius:4px;white-space:nowrap;font-weight:500;line-height:1.6;
  color:var(--c);background:color-mix(in srgb,var(--c) 12%, var(--surface));border:1px solid color-mix(in srgb,var(--c) 30%, transparent)}
.t-VERIFIED{--c:var(--t-verified)} .t-INTERVIEW{--c:var(--t-interview)} .t-HISTORICAL{--c:var(--t-historical)} .t-COMPETITOR{--c:var(--t-competitor)}
.t-CALCULATED{--c:var(--t-calculated)} .t-ASSUMPTION{--c:var(--t-assumption)} .t-UNKNOWN{--c:var(--t-unknown)}
.b-FACT{--c:var(--t-verified)} .b-ESTIMATE{--c:var(--t-calculated)} .b-ASSUMPTION{--c:var(--t-assumption)} .b-UNKNOWN{--c:var(--t-unknown)}
.m-WEB{--c:var(--info)} .m-CALC{--c:var(--t-calculated)} .m-INTERVIEW{--c:var(--t-interview)} .m-AHMED{--c:var(--t-historical)}
.m-HIST{--c:var(--t-historical)} .m-QUOTE{--c:var(--t-competitor)} .m-TEST{--c:var(--good)} .m-UNKNOWN{--c:var(--t-unknown)}
.s-Supports{--c:var(--good)} .s-Challenges{--c:var(--bad)} .s-Mixed{--c:var(--warn)} .s-Neutral{--c:var(--t-unknown)}
.lv-None{--c:var(--t-unknown)} .lv-Low{--c:var(--bad)} .lv-Medium{--c:var(--warn)} .lv-High{--c:var(--good)}
.st{--c:var(--t-unknown)}
.st-Researching,.st-Initial-Research,.st-In-Progress{--c:var(--info)}
.st-Needs-Validation,.st-Market-Testing{--c:var(--warn)}
.st-Promising,.st-Validated,.st-Answered,.st-Complete{--c:var(--good)}
.st-Rejected{--c:var(--bad)} .st-Parked,.st-Cannot-Answer-Yet{--c:var(--faint)}
.pri-High{--c:var(--bad)} .pri-Medium{--c:var(--warn)} .pri-Low{--c:var(--t-unknown)}
.pilot{--c:var(--accent)}
.scr-Pass,.dec-Keep,.sig-strong{--c:var(--good)}
.scr-Concern,.dec-Park,.sig-concerns{--c:var(--warn)}
.scr-Fail,.dec-Kill,.sig-kill{--c:var(--bad)}
.scr-Unknown,.dec-Undecided,.sig-incomplete{--c:var(--t-unknown)}
.tbl.screen td.scr-cell{font-weight:500;white-space:nowrap;min-width:110px}
.scr-bg-Pass{background:var(--fav-4)} .scr-bg-Concern{background:var(--fav-3)} .scr-bg-Fail{background:var(--fav-2)} .scr-bg-Unknown{color:var(--muted)}

/* ---------- Tables ---------- */
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-weight:500;font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface-2)}
.tbl td{padding:8px 10px;border-bottom:1px solid var(--line-2);vertical-align:top}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:var(--surface-2)}
.tbl td.id{font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap}
.tbl .clip{max-width:420px}

/* ---------- Bars & KPIs ---------- */
.bar{height:6px;background:var(--sunken);border-radius:3px;overflow:hidden;min-width:60px}
.bar > i{display:block;height:100%;background:var(--accent);border-radius:3px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.kpi{background:var(--surface);padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.kpi .v{font-family:var(--mono);font-size:22px;font-variant-numeric:tabular-nums;line-height:1.2}
.kpi .k{font-size:12px;color:var(--muted)}

/* ---------- Family list (universe) ---------- */
.fam{border-top:1px solid var(--line-2)}
.fam:first-child{border-top:0}
.fam > summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 16px;background:var(--surface-2)}
.fam > summary::-webkit-details-marker{display:none}
.fam > summary .fname{font-weight:600}
.fam > summary .fcode{font-family:var(--mono);color:var(--muted);margin-right:8px}
.svc{display:grid;grid-template-columns:62px minmax(0,1fr) auto;gap:12px;padding:10px 16px;border-top:1px solid var(--line-2);cursor:pointer;align-items:start}
.svc:hover{background:var(--surface-2)}
.svc .sid{font-family:var(--mono);font-size:12px;color:var(--muted);padding-top:1px}
.svc .sname{font-weight:500}
.svc .sdef{color:var(--muted);font-size:13px}
.svc .smeta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
@media (max-width:640px){.svc{grid-template-columns:52px minmax(0,1fr)}.svc .smeta{grid-column:2;justify-content:flex-start}}

/* ---------- Workspace ---------- */
.ws-head{display:flex;flex-direction:column;gap:10px}
.statement{font-family:var(--serif);font-size:17px;line-height:1.5;color:var(--ink);max-width:86ch}
.statement .x{color:var(--faint);font-family:var(--mono);font-size:13px;padding:0 4px}
.statement .gap{color:var(--t-assumption);font-style:italic}
.tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line);scrollbar-width:thin}
.tabs a{padding:8px 9px;white-space:nowrap;text-decoration:none;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;display:flex;gap:6px;align-items:center;font-size:13.5px}
.tabs a:hover{color:var(--ink)}
.tabs a.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:500}
.tabs .conf{width:7px;height:7px;border-radius:50%;background:var(--c)}
.learn{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
@media (max-width:760px){.learn{grid-template-columns:1fr}}
.learn .lab{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}

.frow{display:grid;grid-template-columns:minmax(160px,230px) minmax(0,1fr) auto;gap:10px 14px;padding:10px 16px;border-top:1px solid var(--line-2);align-items:start}
.frow:first-child{border-top:0}
.frow .fl{font-weight:500;font-size:13px;padding-top:6px}
.frow .fl .h{display:block;font-weight:400;color:var(--faint);font-size:12px}
.frow .fx{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
@media (max-width:760px){.frow{grid-template-columns:1fr}.frow .fl{padding-top:0}.frow .fx{flex-direction:row;align-items:center;justify-content:flex-start}}
.group-title{padding:9px 16px;background:var(--surface-2);border-top:1px solid var(--line);font-size:12px;font-weight:600;letter-spacing:.03em;display:flex;justify-content:space-between;gap:8px}
.group-title.pain{border-left:3px solid var(--t-interview)}
.group-title.money{border-left:3px solid var(--t-calculated)}
.panel > .group-title:first-child{border-top:0;border-radius:var(--radius) var(--radius) 0 0}

.q{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;padding:10px 16px;border-top:1px solid var(--line-2);align-items:start}
.q:first-child{border-top:0}
.q .qid{font-family:var(--mono);font-size:11.5px;color:var(--faint);padding-top:2px}
.q .qt{font-weight:500}
.q .qmeta{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px;align-items:center}
.q .qans{margin-top:6px;color:var(--ink-2);white-space:pre-wrap}
.q.done .qt{color:var(--muted)}
.q .qright{display:flex;gap:6px;align-items:center}
@media (max-width:640px){.q{grid-template-columns:minmax(0,1fr)}.q .qid{display:none}}

/* model table */
table.model{width:100%;border-collapse:collapse;font-size:13px}
.model th,.model td{padding:6px 8px;border-bottom:1px solid var(--line-2);text-align:left;vertical-align:middle}
.model th{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:500}
.model input{font-family:var(--mono);font-size:12.5px;min-width:84px}
.model tr.result td{background:var(--surface-2);font-family:var(--mono);font-weight:500}
.model .op{font-family:var(--mono);color:var(--faint);width:18px;text-align:center}

/* path */
.path{display:flex;gap:0;flex-wrap:wrap;align-items:stretch}
.path .step{flex:1 1 150px;border:1px solid var(--line);background:var(--surface);padding:8px 10px;border-radius:5px;display:flex;flex-direction:column;gap:6px;position:relative;margin:0 14px 10px 0}
.path .step:not(:last-child)::after{content:'\2192';position:absolute;right:-13px;top:10px;color:var(--faint);font-family:var(--mono)}

/* ---------- Decision heatmap ---------- */
.heat{border-collapse:separate;border-spacing:2px;font-size:12.5px;min-width:100%}
.heat th{font-weight:500;text-align:left;padding:6px 8px;color:var(--ink-2);vertical-align:bottom}
.heat th.col{min-width:150px;max-width:200px}
.heat td.cell{padding:0;border-radius:4px;min-width:150px}
.heat td.cell button{all:unset;box-sizing:border-box;display:flex;flex-direction:column;gap:2px;width:100%;min-height:48px;padding:6px 8px;border-radius:4px;cursor:pointer}
.heat td.cell button:focus-visible{outline:2px solid var(--accent)}
.heat .f{font-weight:500}
.heat .c{font-size:11px;color:var(--ink-2)}
.fav-Unknown{background:var(--fav-0)}
.fav-Very-unfavorable{background:var(--fav-1)}
.fav-Unfavorable{background:var(--fav-2)}
.fav-Mixed{background:var(--fav-3)}
.fav-Favorable{background:var(--fav-4)}
.fav-Very-favorable{background:var(--fav-5)}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted);align-items:center}
.legend i{display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:-3px;margin-right:4px}

/* ---------- Drawer & modal ---------- */
.scrim{position:fixed;inset:0;background:rgba(10,15,18,.38);z-index:50}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--surface);z-index:51;box-shadow:var(--shadow);display:flex;flex-direction:column;border-left:1px solid var(--line)}
.drawer .dh{padding:calc(14px + env(safe-area-inset-top,0px)) 18px 12px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.drawer .db{padding:16px 18px;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:14px}
.drawer .df{padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
.evcard{border:1px solid var(--line);border-radius:5px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;background:var(--surface)}
.evcard .ft{font-weight:500;white-space:pre-wrap}
.evcard .src{font-size:12px;color:var(--muted);word-break:break-word}
.toast{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--ground);padding:8px 14px;border-radius:5px;z-index:60;font-size:13px;box-shadow:var(--shadow)}

/* ---------- Script / brief ---------- */
.script{font-size:14px;line-height:1.6}
.script h4{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:14px 0 4px}
.script ol{margin:0;padding-left:20px}
.script li{margin:3px 0}
.script .why{font-size:12px;color:var(--faint)}
.quote{font-family:var(--serif);font-size:16px;line-height:1.5;border-left:2px solid var(--t-interview);padding:2px 0 2px 12px}

/* ---------- Advisor view ---------- */
.report{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:48px 56px;max-width:900px;margin:0 auto;width:100%}
.report h1{font-family:var(--serif);font-size:34px;font-weight:600;line-height:1.15}
.report h2{font-family:var(--serif);font-size:22px;font-weight:600;margin-top:34px;padding-top:18px;border-top:1px solid var(--line);display:flex;gap:12px;align-items:baseline}
.report h2 .n{font-family:var(--mono);font-size:12px;color:var(--faint);font-weight:400}
.report p,.report li{max-width:70ch;line-height:1.6}
.report .lede{font-size:17px;color:var(--ink-2);font-family:var(--serif)}
.report table.tbl{margin-top:10px}
.report .note{font-size:12.5px;color:var(--muted)}
@media (max-width:700px){.report{padding:24px 18px}.report h1{font-size:26px}}

@media print{
  body{background:#fff;color:#000}
  .side,.topbar,.noprint,.toast{display:none!important}
  .app{display:block}
  main{padding:0}
  .report{border:0;padding:0;max-width:none}
  .report h2{break-after:avoid}
  .tbl tr{break-inside:avoid}
}
@media (prefers-reduced-motion: reduce){ *{transition:none!important;animation:none!important} }

/* ---------- Storage adapter ----------
   Browser storage today. To add Cloudflare sync later, implement the same
   three methods (load, save, clear) against a Worker and swap Store.backend. */
const LocalBackend = {
  KEY: 'modonix_service_viability_study_v1',
  load(){ try { const t = localStorage.getItem(this.KEY); return t ? JSON.parse(t) : null; } catch(e){ return null; } },
  save(obj){ try { localStorage.setItem(this.KEY, JSON.stringify(obj)); return true; } catch(e){ return false; } },
  clear(){ try { localStorage.removeItem(this.KEY); } catch(e){} }
};
const Store = {
  backend: LocalBackend,
  timer: null,
  lastSaved: null,
  ok: true,
  save(){
    clearTimeout(this.timer);
    this.timer = setTimeout(() => this.flush(), 350);
    setSaveState('Saving');
  },
  flush(){
    clearTimeout(this.timer);
    S.meta.updated = nowIso();
    this.ok = this.backend.save(S);
    this.lastSaved = new Date();
    setSaveState(this.ok ? 'Saved' : 'Not saved: browser storage unavailable. Download a backup.');
  }
};
function setSaveState(txt){
  const el = document.getElementById('saveState');
  if (!el) return;
  el.textContent = txt === 'Saved' ? 'Saved ' + new Date().toLocaleTimeString([], {hour:'numeric', minute:'2-digit'}) : txt;
  el.dataset.state = txt === 'Saved' ? 'ok' : (txt === 'Saving' ? 'busy' : 'err');
}

/* ---------- IDs ---------- */
const ID_PREFIX = { opp:'OH', q:'Q', ev:'EV', int:'INT', co:'CO', tr:'TR', sc:'SC', f:'MF' };
function nextId(kind){
  S.counters[kind] = (S.counters[kind] || 0) + 1;
  const pad = kind === 'q' || kind === 'ev' ? 4 : 3;
  return ID_PREFIX[kind] + '-' + String(S.counters[kind]).padStart(pad, '0');
}
function nextServiceId(){
  // never reuse a number, even if a service was removed from a file by hand
  const max = Math.max(S.counters.sh || 0, ...S.services.map(s => parseInt(s.id.replace(/\D/g,''),10) || 0));
  S.counters.sh = max + 1;
  return 'SH-' + String(S.counters.sh).padStart(2,'0');
}

/* ---------- Config helpers ---------- */
function normalizeConfig(cfg){
  cfg.blocks.forEach(b => {
    b.questions = (b.questions || []).map((q, i) => Array.isArray(q)
      ? { id: b.key + '-' + (i+1), text:q[0], method:q[1], priority:q[2] || 'Medium', active:true }
      : q);
  });
  return cfg;
}
const C = () => S.config;
const blockDef = k => C().blocks.find(b => b.key === k);
const methodDef = k => C().methods.find(m => m.key === k) || C().methods[C().methods.length-1];
const evTypeDef = k => C().evidenceTypes.find(t => t.key === k) || C().evidenceTypes[C().evidenceTypes.length-1];
const basisLabel = k => (C().basis.find(b => b.key === k) || {label:k}).label;
function fieldDefs(blockKey){
  const b = blockDef(blockKey); if (!b) return [];
  return b.groups.flatMap(g => g.fields);
}

function ensureFamily(name){
  let f = S.families.find(x => x.name === name);
  if (!f){ f = { id:'F' + String(S.families.length+1).padStart(2,'0'), name }; S.families.push(f); }
  return f;
}

/* Merge rows from the workbook. Never deletes. Fills blanks on existing IDs. */
function importServiceRows(rows){
  let added = 0, updated = 0;
  rows.forEach(r => {
    if (!r.id || !/^SH-\d+/i.test(r.id)) return;
    const id = r.id.toUpperCase().trim();
    const fam = ensureFamily(String(r.family || 'Unassigned').trim());
    const status = C().legacyStatusMap[r.status] || (C().serviceStatuses.includes(r.status) ? r.status : 'Not Started');
    let s = S.services.find(x => x.id === id);
    if (!s){
      s = { id, familyId: fam.id, name: r.name || '', definition: r.definition || '', status,
            evidenceState: C().legacyEvidenceMap[r.evidenceState] || 'UNKNOWN',
            overlapFlag: !!(r.overlap && String(r.overlap).trim()), overlapWith: parseIds(r.overlap), overlapNote: r.overlap && !parseIds(r.overlap).length ? String(r.overlap) : '',
            related: [], parentId:'', notes: r.notes || '', pilot:false, created: nowIso() };
      S.services.push(s); added++;
    } else {
      let changed = false;
      ['name','definition','notes'].forEach(k => { if (!s[k] && r[k]) { s[k] = r[k]; changed = true; } });
      if (r.overlap && !s.overlapWith.length){ s.overlapWith = parseIds(r.overlap); s.overlapFlag = true; changed = true; }
      if (changed) updated++;
    }
    const n = parseInt(id.replace(/\D/g,''),10); if (n > (S.counters.sh||0)) S.counters.sh = n;
  });
  S.services.sort((a,b) => parseInt(a.id.slice(3)) - parseInt(b.id.slice(3)));
  return { added, updated };
}
function parseIds(txt){ return String(txt||'').toUpperCase().match(/SH-\d+/g) || []; }

function createOpportunity(serviceId, init = {}){
  const svc = S.services.find(s => s.id === serviceId);
  const o = {
    id: nextId('opp'), serviceId, title: init.title || (svc ? svc.name : 'New hypothesis'),

function migrate(obj){

  obj.config = normalizeConfig(obj.config || clone(DEFAULT_CONFIG));

  if (!obj.config.studyStages.some(s => s.name === 'Family screen')){
    const i = obj.config.studyStages.findIndex(s => s.name === 'Framework');
    obj.config.studyStages.splice(i + 1, 0, clone(def.studyStages.find(s => s.name === 'Family screen')));
  }

  ['families','services','opportunities','questions','evidence','interviews','competitors'].forEach(k => obj[k] = obj[k] || []);

  S.families.forEach(f => familyRec(f.id));

  const byCode = code => S.families.find(f => f.name.startsWith(code + ' '));
  const pre = [

    ['09', 'Ahmed (Sep 2026): paid advertising is not a direction, and Modonix should not become a general digital marketing business. SEO and conversion strategy also sit in this family and have not been ruled in or out.']
  ];
  pre.forEach(([code, note]) => {

/* Transparent rule, not a score: any Fail flags a kill candidate. */
function familySignal(famId){
  const r = familyRec(famId);
  const vals = C().familyCriteria.map(c => r.criteria[c.key].v);
  const n = k => vals.filter(v => v === k).length;
  if (n('Fail')) return { key:'kill', label:'Kill candidate', detail:`${n('Fail')} fail` };
  if (n('Unknown')) return { key:'incomplete', label:'Incomplete', detail:`${n('Unknown')} of ${vals.length} unknown` };
  if (n('Pass') === vals.length) return { key:'strong', label:'Strong candidate', detail:'All pass' };
  return { key:'concerns', label:'Candidate with concerns', detail:`${n('Concern')} concern${n('Concern')>1?'s':''}` };
}

/* ---------- Numbers ---------- */
function num(v){
  if (v === '' || v === null || v === undefined) return null;
  const n = parseFloat(String(v).replace(/[$,%\s]/g,''));
  return isFinite(n) ? n : null;
}
function fmtMoney(n){
  if (n === null || n === undefined || !isFinite(n)) return '';
  const a = Math.abs(n);
  if (a >= 1e9) return '$' + (n/1e9).toFixed(2).replace(/\.?0+$/,'') + 'B';
  if (a >= 1e6) return '$' + (n/1e6).toFixed(2).replace(/\.?0+$/,'') + 'M';
  if (a >= 1e4) return '$' + Math.round(n/1e3) + 'K';
  return '$' + Math.round(n).toLocaleString();
}
function fmtNum(n){ return (n === null || !isFinite(n)) ? '' : Math.round(n).toLocaleString(); }

/* Bottom-up model: product of every factor. % factors divide by 100. */
function marketCalc(o){
  const out = {};
  ['low','base','high'].forEach(sc => {
    let prod = 1, companies = 1, ok = true, hasMoney = false;
    o.market.factors.forEach(f => {
      const n = num(f[sc]);
      if (n === null){ ok = false; return; }
      const m = f.unit === '%' ? n/100 : n;
      prod *= m;
      if (f.unit === '$') hasMoney = true; else companies *= m;
    });
    out[sc] = ok ? { value: prod, companies, hasMoney } : null;
  });
  const vals = o.market.factors.flatMap(f => ['low','base','high'].map(k => ({ has: num(f[k]) !== null })));
  out.filled = vals.filter(v => v.has).length;
  out.total = vals.length;
  return out;
}
function econCalc(o){
  const e = o.econ, out = {};
  ['low','base','high'].forEach(sc => {
    const v = num(e.value[sc]), h = num(e.hours[sc]), r = num(e.rate[sc]), t = num(e.tools[sc]) || 0;
    if (v === null || h === null || r === null){ out[sc] = null; return; }
    const cost = h*r + t;
    out[sc] = { value:v, cost, gp: v - cost, gm: v ? (v - cost)/v : null, effRate: h ? v/h : null };
  });
  return out;
}

/* ---------- Research progress (completeness, NOT attractiveness) ---------- */
const STRONG = () => C().evidenceTypes.filter(t => t.strong).map(t => t.key);

function blockConfidence(o, blockKey){
  const qs = qsFor(o.id).filter(q => q.block === blockKey);
  const answered = qs.filter(q => q.status === 'Answered');
  const strongEv = evFor(o.id).filter(e => e.block === blockKey && STRONG().includes(e.type));
  if (!answered.length && !strongEv.length) return { level:'None', score:0, answered:0, total:qs.length };
  const a = qs.length ? answered.length / qs.length : 0;
  const backed = answered.filter(q => ['FACT','ESTIMATE'].includes(q.basis) || (q.ev||[]).some(id => STRONG().includes((evById(id)||{}).type))).length;
  const e = answered.length ? backed / answered.length : 0;
  let score = a * (0.45 + 0.55*e);
  if (strongEv.length >= 3) score = Math.min(1, score + 0.1);
  const level = score < 0.34 ? 'Low' : score < 0.67 ? 'Medium' : 'High';
  return { level, score, answered:answered.length, total:qs.length };
}
function modelConfidence(items){
  // items: [{filled:bool, basis}]
  if (!items.length) return 0;
  const good = items.filter(i => i.filled && ['FACT','ESTIMATE'].includes(i.basis)).length;
  const any = items.filter(i => i.filled).length;
  return (good + any*0.3) / (items.length * 1.3);
}
function levelOf(score){ return score <= 0 ? 'None' : score < 0.34 ? 'Low' : score < 0.67 ? 'Medium' : 'High'; }

function progress(o){
  const qs = qsFor(o.id), ev = evFor(o.id);
  const answered = qs.filter(q => q.status === 'Answered').length;
  const fieldAssumptions = Object.values(o.fields).flatMap(b => Object.values(b)).filter(v => v.basis === 'ASSUMPTION' && v.v).length;
  const mkt = blockConfidence(o, 'market');
  const mm = modelConfidence(o.market.factors.map(f => ({ filled: num(f.base) !== null, basis: f.basis })));
  const eco = blockConfidence(o, 'economics');
  const em = modelConfidence(Object.values(o.econ).map(f => ({ filled: num(f.base) !== null, basis: f.basis })));
  const ai = blockConfidence(o, 'ai');
  const scen = o.scenarios.filter(s => s.automates || s.remains || s.implication).length / Math.max(1, o.scenarios.length);
  return {
    total: qs.length, answered, unanswered: qs.length - answered,
    open: qs.filter(q => q.status === 'Open').length,
    verified: ev.filter(e => STRONG().includes(e.type)).length,
    evidence: ev.length,
    assumptions: ev.filter(e => e.type === 'ASSUMPTION').length + fieldAssumptions,
    contradictions: ev.filter(e => e.stance === 'Challenges').length,
    mixed: ev.filter(e => e.stance === 'Mixed').length,
    interviews: intFor(o.id).length,
    competitors: coFor(o.id).length,
    marketConf: levelOf(Math.min(mkt.score || 0, 1) * 0.5 + mm * 0.5),
    econConf: levelOf((eco.score || 0) * 0.5 + em * 0.5),
    aiConf: levelOf((ai.score || 0) * 0.6 + scen * 0.4 * (ai.score ? 1 : 0.5)),
    completeness: qs.length ? answered / qs.length : 0
  };
}

function overallEvidenceLevel(o){
  const p = progress(o);
  return levelOf(p.completeness * (0.5 + 0.5 * Math.min(1, p.verified / 15)));
}

function serviceEvidenceState(s){
  const opps = oppsFor(s.id);
  const types = new Set(opps.flatMap(o => evFor(o.id).map(e => e.type)));
  const order = C().evidenceTypes.map(t => t.key);
  const found = order.find(k => types.has(k));
  return found || s.evidenceState || 'UNKNOWN';
}

/* Which field values are assumptions or unknowns (for gap views) */
function fieldGaps(o){
  const out = [];
  C().blocks.forEach(b => fieldDefs(b.key).forEach(f => {
    const v = o.fields[b.key] && o.fields[b.key][f.k];
    if (!v) return;
    out.push({ block:b.key, blockLabel:b.short, field:f.k, label:f.l, val:v });
  }));
  return out;
}

const COLL = { opp:()=>S.opportunities, svc:()=>S.services, q:()=>S.questions, ev:()=>S.evidence, int:()=>S.interviews, co:()=>S.competitors, fam:()=>S.families };
function resolveBind(path){
  const [kind, id, ...rest] = path.split('|');
  const p = rest.join('|');
  let root;
  if (kind === 'meta') root = S.meta;
  else if (kind === 'cfg') root = S.config;
  else if (kind === 'fscr') root = S.families.some(f => f.id === id) ? familyRec(id) : null;
  else root = (COLL[kind] ? COLL[kind]() : []).find(x => x.id === id);
  if (!root) return null;
  const keys = p.split('.');
  let obj = root;
  for (let i = 0; i < keys.length - 1; i++){
    const k = keys[i];
    if (obj[k] === undefined) obj[k] = /^\d+$/.test(keys[i+1]) ? [] : {};
    obj = obj[k];
  }
  return { root, obj, key: keys[keys.length-1], kind };
}
function getBind(path){ const r = resolveBind(path); return r ? r.obj[r.key] : undefined; }
function setBind(path, value){
  const r = resolveBind(path); if (!r) return;
  r.obj[r.key] = value;
  if ('updated' in r.root || r.kind === 'q' || r.kind === 'opp') r.root.updated = nowIso();
  if (r.kind === 'q' && r.key === 'status' && value === 'Answered' && !r.root.answeredOn) r.root.answeredOn = today();
  Store.save();
}

function readInput(el){
  if (el.type === 'checkbox') return el.checked;
  if (el.dataset.type === 'list') return el.value.split(',').map(s => s.trim()).filter(Boolean);
  if (el.dataset.type === 'ids') return parseIds(el.value);
  if (el.multiple) return Array.from(el.selectedOptions).map(o => o.value);
  return el.value;
}
document.addEventListener('input', e => {
  const el = e.target.closest('[data-bind]');
  if (!el || el.tagName === 'SELECT' || el.type === 'checkbox') return;
  setBind(el.dataset.bind, readInput(el));
  if (el.dataset.live) liveUpdate(el.dataset.live);
});
document.addEventListener('change', e => {
  const el = e.target.closest('[data-bind]');
  if (!el) return;
  setBind(el.dataset.bind, readInput(el));
  if (el.tagName === 'SELECT' || el.type === 'checkbox' || el.dataset.rerender) rerender();
});
document.addEventListener('click', e => {

const stanceBadge = s => `<span class="badge s-${s}">${esc(s)}</span>`;
const pilotBadge = () => `<span class="badge pilot">Pilot</span>`;
const bar = (frac) => `<div class="bar" title="${Math.round(frac*100)}%"><i style="width:${Math.round(Math.max(0,Math.min(1,frac))*100)}%"></i></div>`;

function evButton(target, ids, label='Evidence'){
  const n = (ids||[]).length;
  return `<button type="button" class="btn ev ${n?'has':''}" data-act="showEv" data-target="${esc(target)}">${label}${n?` ${n}`:''}</button>`;
}

function fieldRow(o, blockKey, f){
  const val = o.fields[blockKey][f.k] || (o.fields[blockKey][f.k] = blankVal());
  const base = `opp|${o.id}|fields.${blockKey}.${f.k}`;
  let control;
  if (f.t === 'text') control = ta(base + '.v', val.v, f.h || 'What do we currently believe?', 2);
  else if (f.t === 'rating') control = `<div class="row" style="flex-wrap:nowrap">${selInline(base+'.v', C().ratings, val.v || 'Unknown', f.l)}<input type="text" id="${fid(base+'.note')}" data-bind="${esc(base+'.note')}" value="${esc(val.note)}" placeholder="Why this rating"></div>`;
  else if (f.t === 'rtw') control = `<div class="row" style="flex-wrap:nowrap">${selInline(base+'.v', C().rtwLevels, val.v || 'Unknown', f.l)}<input type="text" id="${fid(base+'.note')}" data-bind="${esc(base+'.note')}" value="${esc(val.note)}" placeholder="What exists today, specifically"></div>`;
  else control = inp(base + '.v', val.v, f.h || '');
  return `<div class="frow">
    <div class="fl">${esc(f.l)}${f.h && f.t !== 'text' && f.t !== 'line' ? `<span class="h">${esc(f.h)}</span>` : ''}</div>
    <div>${control}</div>
    <div class="fx">${selInline(base+'.basis', C().basis, val.basis, 'Basis for '+f.l)}${evButton(`field|${o.id}|${blockKey}|${f.k}`, val.ev)}</div>
  </div>`;
}

function questionRow(q, opts={}){
  const o = oppById(q.oppId);
  const done = q.status === 'Answered';
  return `<div class="q ${done?'done':''}">
    <div class="qid">${q.id}</div>
    <div style="min-width:0">
      <div class="qt">${esc(q.text)}</div>
      <div class="qmeta">
        ${methodBadge(q.method)} ${priBadge(q.priority)} ${statusBadge(q.status)}
        ${opts.showOpp && o ? `<a class="small" href="#/opp/${o.id}/${q.block}">${o.id} ${esc(shortTitle(o))}</a> <span class="faint small">${esc((blockDef(q.block)||{}).short||'')}</span>` : ''}
        ${q.answer ? basisBadge(q.basis) : ''}
      </div>
      ${q.answer ? `<div class="qans">${esc(q.answer)}</div>` : ''}
    </div>
    <div class="qright">
      ${evButton(`q|${q.id}`, q.ev)}
      <button type="button" class="btn sm" data-act="editQ" data-id="${q.id}">Work on it</button>
    </div>
  </div>`;
}

function statement(o){
  const d = o.fields.definition, s = svcById(o.serviceId);
  const part = (v, gap) => v ? esc(v) : `<span class="gap">${gap}</span>`;
  return `<div class="statement">${esc(s ? s.name : o.serviceId)}<span class="x">x</span>${part(d.segment.v, 'segment not defined')}${d.company.v ? ', ' + esc(d.company.v) : ''}<span class="x">x</span>${part(d.problem.v, 'problem not defined')}</div>`;
}

function download(filename, content, type){
  const blob = content instanceof Blob ? content : new Blob([content], { type });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = filename;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
async function copyText(txt){
  try { await navigator.clipboard.writeText(txt); toast('Copied to clipboard'); }
  catch(e){
    const t = document.createElement('textarea'); t.value = txt; document.body.appendChild(t); t.select();
    try { document.execCommand('copy'); toast('Copied to clipboard'); } catch(_){ toast('Copy failed. Select the text manually.'); }
    t.remove();
  }
}

function setParam(k, v, focusId){
  const r = parseRoute();
  const p = new URLSearchParams(r.params);
  if (v) p.set(k, v); else p.delete(k);
  const hash = '#/' + r.parts.join('/') + (p.toString() ? '?' + p.toString() : '');
  history.replaceState(null, '', hash);
  const pos = focusId && document.getElementById(focusId) && document.getElementById(focusId).selectionStart;
  rerender();
  if (focusId){ const el = document.getElementById(focusId); if (el){ el.focus(); try { el.setSelectionRange(pos, pos); } catch(_){} } }
}

      ${statement(o)}

        <span class="num">${p.answered}/${p.total} questions answered</span>
        <span class="num">${p.verified} strong evidence</span>
        <span class="num">${plural(p.assumptions,'assumption')}</span>
        <span class="num">${p.contradictions} contradicting</span>
        <span class="num">${plural(p.interviews,'interview')}</span>
        <span class="num">${plural(p.competitors,'competitor')}</span>
      </div>
    </div>
    <nav class="tabs" aria-label="Research blocks">
      ${tabs.map(t => { let dot = ''; if (t.block){ const c = blockConfidence(o, t.key); dot = `<span class="conf lv-${c.level}" title="Research confidence: ${c.level}"></span>`; }
        return `<a href="#/opp/${o.id}/${t.key}" class="${tab===t.key?'on':''}">${dot}${esc(t.label)}</a>`; }).join('')}
    </nav>
    ${body}
  </div>`;
};

function learnPanel(o, b){
  const c = blockConfidence(o, b.key);
  const evs = evFor(o.id).filter(e => e.block === b.key);
  return `<section class="panel"><div class="pb learn">
    <div><div class="lab">What we are trying to learn</div><div>${esc(b.learn)}</div></div>
    <div><div class="lab">Why it matters</div><div>${esc(b.why)}</div></div>
  </div>
  <div class="ph" style="border-top:1px solid var(--line-2);border-bottom:0">
    <div class="row">${levelBadge(c.level, 'Research confidence: ')}<span class="small muted num">${c.answered} of ${c.total} questions answered</span></div>
    ${evButton(`block|${o.id}|${b.key}`, evs.map(e => e.id), 'Show evidence')}
  </div></section>`;
}

function blockQuestions(o, blockKey){
  const qs = qsFor(o.id).filter(q => q.block === blockKey)
    .sort((a,b) => (a.status==='Answered') - (b.status==='Answered') || C().priorities.indexOf(a.priority) - C().priorities.indexOf(b.priority));
  return `<section class="panel">
    <div class="ph"><h2 class="sh">What we don't know yet</h2><button class="btn sm" data-act="addQ" data-opp="${o.id}" data-block="${blockKey}" type="button">Add question</button></div>
    ${qs.map(q => questionRow(q)).join('') || '<div class="empty">No questions in this block.</div>'}
  </section>`;
}

function beliefPanel(o, b){
  return `<section class="panel">
    <div class="ph"><h2 class="sh">What we currently believe</h2><span class="small muted">Tag every entry: Unknown, Assumption, Evidence-based estimate, or Fact</span></div>
    ${b.groups.map(g => `<div class="group-title ${g.side||''}"><span>${esc(g.title)}</span>${g.side==='pain'?'<span class="faint">Feels the problem</span>':g.side==='money'?'<span class="faint">Controls the money</span>':''}</div>
      ${g.fields.map(f => fieldRow(o, b.key, f)).join('')}`).join('')}
  </section>`;
}

function wsBlock(o, key){
  const b = blockDef(key);
  const special = { triggers: triggersPanel, market: marketPanel, competition: competitionPanel, economics: econPanel, ai: scenariosPanel, expansion: expansionPanel }[key];
  return `${learnPanel(o, b)}
    ${blockQuestions(o, key)}
    ${special ? special(o) : ''}
    ${beliefPanel(o, b)}`;
}

/* ---------- Summary ---------- */
function wsSummary(o){
  const p = progress(o);
  const pth = `opp|${o.id}|`;
  const gaps = fieldGaps(o);
  const blocks = C().blocks.map(b => {
    const c = blockConfidence(o, b.key);
    const g = gaps.filter(x => x.block === b.key);
    return { b, c, unknown: g.filter(x => x.val.basis === 'UNKNOWN').length, assumed: g.filter(x => x.val.basis === 'ASSUMPTION').length, ev: evFor(o.id).filter(e => e.block === b.key).length, total: g.length };
  });
  const topQ = qsFor(o.id).filter(q => q.status !== 'Answered' && q.priority === 'High').slice(0, 5);
  return `
  <div class="grid2">
    <section class="panel"><div class="ph"><h2 class="sh">Hypothesis record</h2></div><div class="pb form">
      <div class="wide"><label class="lbl" for="${fid(pth+'title')}">Short name</label>${inp(pth+'title', o.title, '', 'text', 'data-rerender="1"')}</div>
      <div><label class="lbl" for="${fid(pth+'serviceId')}">Service</label>${sel(pth+'serviceId', S.services.map(s => ({key:s.id,label:`${s.id} ${s.name}`})), o.serviceId)}</div>
      <div><label class="lbl" for="${fid(pth+'status')}">Status</label>${sel(pth+'status', C().serviceStatuses, o.status)}</div>
      <div class="wide"><label class="lbl" for="${fid(pth+'summary')}">Current working conclusion</label>${ta(pth+'summary', o.summary, 'In one paragraph: what do we believe right now, and how sure are we?', 4)}</div>
      <label class="row small" style="gap:6px"><input type="checkbox" id="${fid(pth+'pilot')}" data-bind="${pth}pilot" ${o.pilot?'checked':''}> Pilot hypothesis</label>
    </div></section>

    <section class="panel"><div class="ph"><h2 class="sh">Research progress</h2><span class="small muted">Completeness, not attractiveness</span></div>
      <div class="pb stack">
        <div class="row" style="justify-content:space-between"><span>Overall research completeness</span><strong class="num">${Math.round(p.completeness*100)}%</strong></div>${bar(p.completeness)}
        <div class="kpis" style="grid-template-columns:repeat(3,minmax(0,1fr))">
          <div class="kpi"><span class="v">${p.answered}</span><span class="k">Answered</span></div>
          <div class="kpi"><span class="v">${p.unanswered}</span><span class="k">Unanswered</span></div>
          <div class="kpi"><span class="v">${p.verified}</span><span class="k">Strong evidence</span></div>
          <div class="kpi"><span class="v">${p.assumptions}</span><span class="k">Assumptions</span></div>
          <div class="kpi"><span class="v">${p.contradictions}</span><span class="k">Contradicting</span></div>
          <div class="kpi"><span class="v">${p.interviews}</span><span class="k">Interviews</span></div>
        </div>
        <div class="row">${levelBadge(p.marketConf, 'Market sizing: ')}${levelBadge(p.econConf, 'Economics: ')}${levelBadge(p.aiConf, 'AI / future: ')}</div>
      </div>
    </section>
  </div>

  <section class="panel">
    <div class="ph"><h2 class="sh">Gaps by block</h2><span class="small muted">Where the research stands and where the unknowns sit</span></div>
    <div class="tbl-wrap"><table class="tbl">
      <thead><tr><th>Block</th><th>Confidence</th><th>Questions</th><th>Unknown fields</th><th>Assumed fields</th><th>Evidence</th></tr></thead>
      <tbody>${blocks.map(x => `<tr class="click" data-act="goto" data-href="#/opp/${o.id}/${x.b.key}">
        <td><strong>${esc(x.b.label)}</strong></td><td>${levelBadge(x.c.level)}</td>
        <td style="min-width:120px"><span class="small num">${x.c.answered}/${x.c.total}</span>${bar(x.c.total ? x.c.answered/x.c.total : 0)}</td>
        <td class="num">${x.unknown}/${x.total}</td><td class="num">${x.assumed}</td><td class="num">${x.ev}</td></tr>`).join('')}</tbody>
    </table></div>
  </section>

  <section class="panel">
    <div class="ph"><h2 class="sh">Next high-priority questions</h2><a class="btn sm" href="#/queue?opp=${o.id}">Queue for this hypothesis</a></div>
    ${topQ.map(q => questionRow(q, {showOpp:false})).join('') || '<div class="empty">No high-priority questions open.</div>'}
  </section>

  <div class="row noprint" style="justify-content:flex-end"><button class="btn sm danger" data-act="deleteOpp" data-id="${o.id}" type="button">Delete this hypothesis</button></div>`;
}

/* ---------- Triggers ---------- */
function triggersPanel(o){

    <div class="ph"><h2 class="sh">Trigger events under investigation</h2>
      <div class="row">

    ${o.triggers.length ? `<div class="tbl-wrap"><table class="tbl" style="margin-top:8px">

        <td style="min-width:260px">${ta(bp+'signal', t.signal, 'Observable signal: job post, press release, platform change...', 2)}${inp(bp+'note', t.note, 'Source or note')}</td>

        <td class="nowrap">${evButton(`trig|${o.id}|${t.id}`, t.ev)} <button class="btn sm ghost danger" data-act="removeTrigger" data-opp="${o.id}" data-id="${t.id}" type="button" aria-label="Remove trigger">Remove</button></td>

/* ---------- Market model ---------- */
function marketPanel(o){
  const m = o.market;
  const key = 'mkt-' + o.id;
  LIVE[key] = () => { const el = document.getElementById('mktResult_' + o.id); if (el) el.innerHTML = marketResultRows(o); };
  return `<section class="panel">
    <div class="ph"><h2 class="sh">Bottom-up market estimate</h2><span class="small muted">Qualified companies x incidence x addressable share x spend. Every factor shows its basis.</span></div>
    <div class="pb row"><label class="lbl" for="${fid(`opp|${o.id}|market.geography`)}" style="margin:0">Geography</label><div style="width:240px">${inp(`opp|${o.id}|market.geography`, m.geography)}</div></div>
    <div class="tbl-wrap"><table class="model">
      <thead><tr><th></th><th>Factor</th><th>Unit</th><th>Low</th><th>Base</th><th>High</th><th>Basis</th><th>Source / reasoning</th><th></th></tr></thead>
      <tbody>
      ${m.factors.map((f, i) => { const bp = `opp|${o.id}|market.factors.${i}.`; return `<tr>
        <td class="op">${i ? 'x' : ''}</td>
        <td style="min-width:190px">${f.custom ? inp(bp+'l', f.l) : `<strong>${esc(f.l)}</strong>`}</td>
        <td>${f.custom ? selInline(bp+'unit', [{key:'count',label:'count'},{key:'%',label:'%'},{key:'x',label:'x'},{key:'$',label:'$'}], f.unit, 'Unit') : `<span class="mono small">${esc(f.unit)}</span>`}</td>
        ${['low','base','high'].map(k => `<td>${inp(bp+k, f[k], '', 'text', `inputmode="decimal" data-live="${key}"`)}</td>`).join('')}
        <td>${selInline(bp+'basis', C().basis, f.basis, 'Basis')}</td>
        <td style="min-width:200px">${inp(bp+'source', f.source, 'Where does this number come from?')}</td>
        <td class="nowrap">${evButton(`mf|${o.id}|${f.id}`, f.ev)}${f.custom ? ` <button class="btn sm ghost danger" data-act="removeFactor" data-opp="${o.id}" data-id="${f.id}" type="button">Remove</button>` : ''}</td>
      </tr>`; }).join('')}
      </tbody>
      <tbody id="mktResult_${o.id}">${marketResultRows(o)}</tbody>
    </table></div>
    <div class="pb row"><button class="btn sm" data-act="addFactor" data-opp="${o.id}" type="button">Add factor</button><span class="small muted">For example a win rate or purchase frequency. Percent factors are divided by 100. The result is blank until every factor has a value.</span></div>
  </section>`;
}
function marketResultRows(o){
  const r = marketCalc(o);
  const cell = (x, fn) => x ? fn(x) : '<span class="faint">incomplete</span>';
  const hasMoney = o.market.factors.some(f => f.unit === '$');
  return `<tr class="result"><td></td><td>Addressable companies</td><td></td>
      ${['low','base','high'].map(k => `<td>${cell(r[k], x => fmtNum(x.companies))}</td>`).join('')}<td colspan="3" class="small">${evBadge('CALCULATED')} from the factors above</td></tr>
    ${hasMoney ? `<tr class="result"><td>=</td><td>Bottom-up market (annual or per cycle)</td><td></td>
      ${['low','base','high'].map(k => `<td>${cell(r[k], x => fmtMoney(x.value))}</td>`).join('')}<td colspan="3" class="small">Only as credible as the weakest factor</td></tr>` : ''}`;
}

/* ---------- Competition ---------- */
function competitionPanel(o){
  const linked = coFor(o.id);
  const others = S.competitors.filter(c => !linked.includes(c));
  return `<section class="panel">
    <div class="ph"><h2 class="sh">Competitors and alternatives researched</h2>
      <div class="row">
        ${others.length ? `<select class="inline" id="coLink_${o.id}" aria-label="Link an existing competitor"><option value="">Link existing</option>${opts(others.map(c => ({key:c.id,label:`${c.id} ${c.name||'Unnamed'}`})), '')}</select><button class="btn sm" data-act="linkCo" data-opp="${o.id}" type="button">Link</button>` : ''}
        <button class="btn sm primary" data-act="newCo" data-opp="${o.id}" type="button">Add competitor</button>
      </div></div>
    ${linked.length ? `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>ID</th><th>Name</th><th>Type</th><th>Target</th><th>Positioning / offer</th><th>Pricing evidence</th></tr></thead><tbody>
      ${linked.map(c => `<tr class="click" data-act="editCo" data-id="${c.id}"><td class="id">${c.id}</td><td><strong>${esc(c.name||'Unnamed')}</strong>${c.url?`<div class="small"><a href="${esc(c.url)}" target="_blank" rel="noopener">${esc(c.url)}</a></div>`:''}</td><td>${esc(c.type)}</td><td>${esc(c.target)}</td><td class="clip">${esc(c.positioning)}</td><td>${esc(c.pricing)||'<span class="faint">None yet</span>'}</td></tr>`).join('')}
    </tbody></table></div>` : '<div class="empty">No competitors linked. Include software, AI tools, internal staff, and doing nothing.</div>'}

}

/* ---------- Economics ---------- */
function econPanel(o){
  const key = 'eco-' + o.id;
  LIVE[key] = () => { const el = document.getElementById('ecoResult_' + o.id); if (el) el.innerHTML = econResultRows(o); };
  const rows = [['value','Project value','$'],['hours','Delivery hours','hrs'],['rate','Blended delivery cost per hour','$/hr'],['tools','Software / tool cost per project','$']];
  return `<section class="panel">
    <div class="ph"><h2 class="sh">Project economics model</h2><span class="small muted">Delivery cost = hours x hourly cost + tools</span></div>
    <div class="tbl-wrap"><table class="model">
      <thead><tr><th>Input</th><th>Unit</th><th>Low</th><th>Base</th><th>High</th><th>Basis</th><th>Source / reasoning</th><th></th></tr></thead>
      <tbody>${rows.map(([k, l, u]) => { const f = o.econ[k]; const bp = `opp|${o.id}|econ.${k}.`; return `<tr>
        <td style="min-width:200px"><strong>${l}</strong></td><td class="mono small">${u}</td>
        ${['low','base','high'].map(s => `<td>${inp(bp+s, f[s], '', 'text', `inputmode="decimal" data-live="${key}"`)}</td>`).join('')}
        <td>${selInline(bp+'basis', C().basis, f.basis, 'Basis')}</td>
        <td style="min-width:200px">${inp(bp+'source', f.source, 'Quote, past project, time study...')}</td>
        <td>${evButton(`ec|${o.id}|${k}`, f.ev)}</td></tr>`; }).join('')}</tbody>
      <tbody id="ecoResult_${o.id}">${econResultRows(o)}</tbody>
    </table></div>
  </section>`;
}
function econResultRows(o){
  const r = econCalc(o);
  const cell = (x, fn) => x ? fn(x) : '<span class="faint">incomplete</span>';
  const row = (l, fn) => `<tr class="result"><td>${l}</td><td></td>${['low','base','high'].map(k => `<td>${cell(r[k], fn)}</td>`).join('')}<td colspan="3" class="small">${evBadge('CALCULATED')}</td></tr>`;
  return row('Delivery cost', x => fmtMoney(x.cost)) + row('Gross profit', x => fmtMoney(x.gp)) + row('Gross margin', x => x.gm === null ? '' : Math.round(x.gm*100) + '%') + row('Revenue per delivery hour', x => x.effRate === null ? '' : fmtMoney(x.effRate));
}

/* ---------- Evidence tab ---------- */
function wsEvidence(o, r){
  const b = r.params.block || '', t = r.params.type || '';
  const list = evFor(o.id).filter(e => (!b || e.block === b) && (!t || e.type === t));
  return `<section class="panel">
    <div class="ph"><h2 class="sh">Evidence for this hypothesis</h2>
      <div class="row">
        <select class="inline" data-filter="block" id="evfBlock" aria-label="Block"><option value="">All blocks</option>${opts(C().blocks.map(x => ({key:x.key,label:x.label})), b)}</select>
        <select class="inline" data-filter="type" id="evfType" aria-label="Type"><option value="">All types</option>${opts(C().evidenceTypes, t)}</select>
        <button class="btn sm primary" data-act="newEv" data-opp="${o.id}" data-block="${b}" type="button">Add evidence</button>

    <thead><tr><th>ID</th>${showOpp?'<th>Hypothesis</th>':''}<th>Block</th><th>Finding</th><th>Type</th><th>Source</th><th>Date</th><th>Confidence</th><th>Stance</th></tr></thead>
    <tbody>${list.map(e => `<tr class="click" data-act="editEv" data-id="${e.id}">

      <td>${evBadge(e.type)}</td>
      <td class="small">${esc(e.source)}${e.url?`<div><a href="${esc(e.url)}" target="_blank" rel="noopener">link</a></div>`:''}</td>
      <td class="nowrap small">${esc(e.date)}</td>
      <td>${esc(e.confidence)}</td>
      <td>${stanceBadge(e.stance)}</td>
    </tr>`).join('')}</tbody></table></div>`;
}

function interviewGuide(o){
  const bank = C().interviewBank;
  const s = svcById(o.serviceId);
  const prob = o.fields.definition.problem.v;
  const fill = t => t.replace('{service}', (s ? s.name : 'this area').toLowerCase())
    .replace('{problem_q}', prob ? `"${prob.trim().replace(/\.$/,'')}."` : `companies struggle with ${(s ? s.name : 'this').toLowerCase()}.`);
  const openInt = qsFor(o.id).filter(q => q.status !== 'Answered' && q.method === 'INTERVIEW');
  const order = ['definition','icp','spin','triggers','buying','competition','economics','market','ai','rtw','expansion'];
  const sections = [];
  sections.push({ title:'Opening', items: (bank.opening||[]).map(fill), gaps:[] });
  order.forEach(k => {
    const gaps = openInt.filter(q => q.block === k);
    const items = (bank[k] || []).map(fill);
    if (!gaps.length || !items.length) return;
    sections.push({ title: blockDef(k).label, items, gaps });
  });
  const txt = [`INTERVIEW GUIDE: ${o.id} ${o.title}`, '', 'Rules: ask about past behavior, not hypothetical buying. Capture exact words.', ''];
  const html = `
    <div class="small muted">Built from the ${openInt.length} open interview questions for this hypothesis. Ask about what happened, not what they would do. Write down their exact words.</div>
    ${openInt.length ? '' : '<div class="callout" style="margin-top:10px">All interview-routed questions are answered. Add or reopen questions to regenerate.</div>'}
    ${sections.map(sec => {
      txt.push(sec.title.toUpperCase()); sec.items.forEach((it, i) => txt.push(`${i+1}. ${it}`));
      if (sec.gaps.length) txt.push('   Covers: ' + sec.gaps.map(g => g.id).join(', '));
      txt.push('');
      return `<h4>${esc(sec.title)}</h4><ol>${sec.items.map(it => `<li>${esc(it)}</li>`).join('')}</ol>
        ${sec.gaps.length ? `<div class="why">Closes: ${sec.gaps.map(g => `<span title="${esc(g.text)}">${g.id}</span>`).join(', ')}</div>` : ''}`;
    }).join('')}
    <h4>Close</h4><ol><li>Who else should I talk to about this?</li><li>Can I follow up if I have another question?</li></ol>
    <h4>Do not ask</h4><ul style="margin:0;padding-left:20px">${(bank.avoid||[]).map(a => `<li class="muted"><s>${esc(a)}</s></li>`).join('')}</ul>`;
  txt.push('CLOSE', '1. Who else should I talk to about this?', '2. Can I follow up if I have another question?', '', 'DO NOT ASK', ...(bank.avoid||[]).map(a => '- ' + a));
  return { html, text: txt.join('\n') };
}

VIEWS.queue = (r) => {

    (!pr.method || q.method === pr.method) && (!pr.opp || q.oppId === pr.opp) &&
    (!pr.priority || q.priority === pr.priority) && (!pr.block || q.block === pr.block))
    .sort((a,b) => C().priorities.indexOf(a.priority) - C().priorities.indexOf(b.priority) || a.id.localeCompare(b.id));
  const groupBy = pr.group || 'method';
  let groups;
  if (groupBy === 'method') groups = C().methods.map(m => ({ key:m.key, title:m.label, sub:'Answered by: ' + m.who, items: qs.filter(q => q.method === m.key) }));
  else if (groupBy === 'opp') groups = S.opportunities.map(o => ({ key:o.id, title:`${o.id} ${o.title}`, sub:'', items: qs.filter(q => q.oppId === o.id) }));

  return `<div class="page">
    <div class="head"><div class="left">
      <div class="eyebrow">Research question router</div>
      <h1 class="title">Research queue</h1>
      <div class="subtitle">Every unanswered question, routed to whoever or whatever should answer it. ${researchable} can be answered by desk research or calculation; only ${ahmed} need Ahmed.</div>
    </div>
    <div class="row">${pr.method ? `<button class="btn" data-act="copyBrief" type="button">Copy as research brief</button>` : ''}</div></div>
    <div class="row">
      <select class="inline" data-filter="status" id="qStatus" aria-label="Status">${opts([{key:'unanswered',label:'Unanswered'},{key:'all',label:'All'}, ...C().questionStatuses.map(x => ({key:x,label:x}))], status)}</select>
      <select class="inline" data-filter="method" id="qMethod" aria-label="Method"><option value="">All methods</option>${opts(C().methods, pr.method||'')}</select>
      <select class="inline" data-filter="opp" id="qOpp" aria-label="Hypothesis"><option value="">All hypotheses</option>${opts(S.opportunities.map(o => ({key:o.id,label:`${o.id} ${shortTitle(o)}`})), pr.opp||'')}</select>
      <select class="inline" data-filter="block" id="qBlock" aria-label="Block"><option value="">All blocks</option>${opts(C().blocks.map(b => ({key:b.key,label:b.label})), pr.block||'')}</select>
      <select class="inline" data-filter="priority" id="qPri" aria-label="Priority"><option value="">Any priority</option>${opts(C().priorities, pr.priority||'')}</select>
      <span class="small muted">Group by</span>
      <select class="inline" data-filter="group" id="qGroup" aria-label="Group by">${opts([{key:'method',label:'Method'},{key:'opp',label:'Hypothesis'},{key:'block',label:'Block'}], groupBy)}</select>
      <span class="small muted num">${qs.length} questions</span>
    </div>
    ${groups.map(g => `<section class="panel">
      <div class="ph"><div class="row">${groupBy==='method'?methodBadge(g.key):''}<h2 class="sh">${esc(groupBy==='method'?'':g.title)}</h2><span class="small muted">${esc(g.sub)}</span></div><span class="mono small">${g.items.length}</span></div>
      ${g.items.map(q => questionRow(q, {showOpp:true})).join('')}
    </section>`).join('') || '<div class="panel empty">Nothing in the queue for these filters.</div>'}
  </div>`;
};

function researchBrief(){
  const pr = parseRoute().params;
  const status = pr.status || 'unanswered';
  const qs = S.questions.filter(q => (status === 'all' || (status === 'unanswered' ? q.status !== 'Answered' : q.status === status)) && (!pr.method || q.method === pr.method) && (!pr.opp || q.oppId === pr.opp) && (!pr.priority || q.priority === pr.priority) && (!pr.block || q.block === pr.block));
  const lines = ['RESEARCH BRIEF: Modonix Service Viability Study', 'Method: ' + methodDef(pr.method).label, '',
    'Rules: cite a source URL and date for every finding. Label each finding as verified market evidence, competitor evidence, calculated estimate, assumption, or unknown. Prefer bottom-up numbers over global market reports. Say "unknown" rather than guessing.', ''];
  S.opportunities.forEach(o => {
    const list = qs.filter(q => q.oppId === o.id); if (!list.length) return;
    const d = o.fields.definition;
    lines.push(`HYPOTHESIS ${o.id}: ${o.title}`);
    lines.push(`Service: ${(svcById(o.serviceId)||{}).name || o.serviceId}`);
    if (d.segment.v) lines.push(`Segment: ${d.segment.v}${d.company.v ? ' (' + d.company.v + ')' : ''}`);
    if (d.situation.v) lines.push(`Situation: ${d.situation.v}`);
    if (d.problem.v) lines.push(`Problem: ${d.problem.v}`);
    list.forEach(q => lines.push(`- [${q.id}] ${q.text}`));
    lines.push('');
  });
  return lines.join('\n');
}

function advisorMatrix(opps){

}

document.addEventListener('change', async e => {
  if (e.target.id === 'restoreFile' && e.target.files[0]){
    try {
      const obj = migrate(JSON.parse(await e.target.files[0].text()));
      if (!obj) throw new Error('This file is not a study backup.');
      if (!confirm('Replace all data in this browser with this backup?')) return;
      S = obj; Store.flush(); toast('Backup restored'); render(true);
    } catch(err){ alert('Restore failed: ' + err.message); }
    e.target.value = '';
  }
  if (e.target.id === 'importXlsx' && e.target.files[0]){
    try {
      if (typeof XLSX === 'undefined') throw new Error('The Excel library did not load. Check your connection and reload.');
      const wb = XLSX.read(await e.target.files[0].arrayBuffer());
      const name = wb.SheetNames.find(n => /service universe/i.test(n)) || wb.SheetNames[0];
      const rows = XLSX.utils.sheet_to_json(wb.Sheets[name], { header:1, defval:'' });
      const hi = rows.findIndex(r => r.some(c => /service id/i.test(String(c))));
      if (hi < 0) throw new Error('No "Service ID" header found in sheet ' + name);
      const h = rows[hi].map(c => String(c).toLowerCase());
      const col = re => h.findIndex(c => re.test(c));
      const ci = { id:col(/service id/), family:col(/family/), name:col(/service hypothesis/), definition:col(/definition/), overlap:col(/overlap/), status:col(/research status/), evidenceState:col(/evidence state/), notes:col(/notes/) };
      const out = rows.slice(hi+1).map(r => Object.fromEntries(Object.entries(ci).map(([k, i]) => [k, i >= 0 ? String(r[i]).trim() : ''])));
      const res = importServiceRows(out);
      Store.save(); toast(`Imported: ${res.added} added, ${res.updated} updated`); rerender();
    } catch(err){ alert('Import failed: ' + err.message); }
    e.target.value = '';
  }
});

/* Resolve an evidence target: where the linked evidence IDs live */
function evTarget(target){
  const [kind, a, b, c] = target.split('|');
  const o = oppById(a);
  switch(kind){
    case 'field': {
      const v = o.fields[b][c]; v.ev = v.ev || [];
      const f = fieldDefs(b).find(x => x.k === c) || { l:c };
      return { ids: v.ev, oppId:a, block:b, title: f.l, eyebrow:`${a} / ${blockDef(b).short}`,
        context: `<div class="panel flat pb"><div class="small muted">Current belief</div><div style="white-space:pre-wrap">${esc(v.v) || '<span class="faint">Nothing recorded</span>'}</div><div style="margin-top:6px">${basisBadge(v.basis)}</div></div>` };
    }
    case 'q': {
      const q = S.questions.find(x => x.id === a); q.ev = q.ev || [];
      return { ids: q.ev, oppId:q.oppId, block:q.block, title:q.text, eyebrow:q.id, context:'' };
    }
    case 'dim': { const v = o.verdicts[b]; v.ev = v.ev || []; return { ids:v.ev, oppId:a, block:(C().decisionDims.find(d => d.key === b)||{blocks:['definition']}).blocks[0], title:(C().decisionDims.find(d => d.key === b)||{}).label, eyebrow:a, context:'' }; }
    case 'trig': { const t = o.triggers.find(x => x.id === b); t.ev = t.ev || []; return { ids:t.ev, oppId:a, block:'triggers', title:'Trigger: ' + (t.event||''), eyebrow:a, context:'' }; }
    case 'mf': { const f = o.market.factors.find(x => x.id === b); f.ev = f.ev || []; return { ids:f.ev, oppId:a, block:'market', title:'Market factor: ' + f.l, eyebrow:a, context:'' }; }
    case 'ec': { const f = o.econ[b]; f.ev = f.ev || []; return { ids:f.ev, oppId:a, block:'economics', title:'Economics input: ' + b, eyebrow:a, context:'' }; }
    case 'sc': { const s = o.scenarios.find(x => x.id === b); s.ev = s.ev || []; return { ids:s.ev, oppId:a, block:'ai', title:'Scenario: ' + s.name, eyebrow:a, context:'' }; }
    case 'co': { const co = S.competitors.find(x => x.id === a); co.ev = co.ev || []; return { ids:co.ev, oppId:(co.oppIds||[])[0] || '', block:'competition', title:co.name || co.id, eyebrow:co.id, context:'' }; }
    case 'fam': {
      const c = C().familyCriteria.find(x => x.key === b) || { label:b, block:'definition' };
      const v = familyRec(a).criteria[b]; v.ev = v.ev || [];
      const fp = famParts(famById(a));
      return { ids:v.ev, oppId:'', familyId:a, block:c.block, title:`${fp.name}: ${c.label}`, eyebrow:`Family ${fp.code}`,
        context: `<div class="panel flat pb"><div class="row">${scrBadge(v.v)}${basisBadge(v.basis)}</div>${v.note ? `<div style="margin-top:6px;white-space:pre-wrap">${esc(v.note)}</div>` : ''}</div>` };
    }
    case 'block': return { ids: evFor(a).filter(e => e.block === b).map(e => e.id), readonly:true, oppId:a, block:b, title: blockDef(b).label + ': all evidence', eyebrow:a, context:'' };
  }
  return { ids:[], readonly:true, title:'Evidence' };
}

        <div class="wide"><label class="lbl" for="evd_${dk}_finding">Finding</label><textarea id="evd_${dk}_finding" data-evd="${esc(target)}" data-k="finding" rows="3" placeholder="What did we learn? Be specific.">${esc(d.finding)}</textarea></div>
        <div><label class="lbl" for="evd_${dk}_type">Evidence type</label><select id="evd_${dk}_type" data-evd="${esc(target)}" data-k="type">${opts(C().evidenceTypes, d.type)}</select></div>
        <div><label class="lbl" for="evd_${dk}_stance">Supports or challenges</label><select id="evd_${dk}_stance" data-evd="${esc(target)}" data-k="stance">${opts(C().stances, d.stance)}</select></div>
        <div><label class="lbl" for="evd_${dk}_source">Source / organization</label><input id="evd_${dk}_source" data-evd="${esc(target)}" data-k="source" value="${esc(d.source)}"></div>
        <div><label class="lbl" for="evd_${dk}_url">Source URL or document</label><input id="evd_${dk}_url" data-evd="${esc(target)}" data-k="url" value="${esc(d.url)}"></div>
        <div><label class="lbl" for="evd_${dk}_date">Date</label><input type="date" id="evd_${dk}_date" data-evd="${esc(target)}" data-k="date" value="${esc(d.date)}"></div>
        <div><label class="lbl" for="evd_${dk}_confidence">Confidence</label><select id="evd_${dk}_confidence" data-evd="${esc(target)}" data-k="confidence">${opts(C().confidence, d.confidence)}</select></div>

function evidenceUses(id){
  const out = [];
  S.questions.forEach(q => { if ((q.ev||[]).includes(id)) out.push(`${q.id} ${q.text}`); });
  S.opportunities.forEach(o => {
    Object.entries(o.fields).forEach(([bk, fs]) => Object.entries(fs).forEach(([k, v]) => { if ((v.ev||[]).includes(id)) out.push(`${o.id} ${blockDef(bk).short}: ${(fieldDefs(bk).find(f => f.k === k)||{l:k}).l}`); }));
    Object.entries(o.verdicts).forEach(([k, v]) => { if ((v.ev||[]).includes(id)) out.push(`${o.id} assessment: ${k}`); });
    o.triggers.forEach(t => { if ((t.ev||[]).includes(id)) out.push(`${o.id} trigger: ${t.event}`); });
    o.market.factors.forEach(f => { if ((f.ev||[]).includes(id)) out.push(`${o.id} market factor: ${f.l}`); });
    Object.entries(o.econ).forEach(([k, f]) => { if ((f.ev||[]).includes(id)) out.push(`${o.id} economics: ${k}`); });
    o.scenarios.forEach(s => { if ((s.ev||[]).includes(id)) out.push(`${o.id} scenario: ${s.name}`); });
  });
  S.competitors.forEach(c => { if ((c.ev||[]).includes(id)) out.push(`${c.id} ${c.name}`); });
  Object.entries(S.familyScreen || {}).forEach(([fid_, r]) => Object.entries(r.criteria).forEach(([k, v]) => { if ((v.ev||[]).includes(id)){ const f = famById(fid_); out.push(`Family screen ${f ? famParts(f).name : fid_}: ${(C().familyCriteria.find(c => c.key === k)||{label:k}).label}`); } }));
  return out;
}
function removeEvidenceEverywhere(id){
  const strip = a => { if (!a) return; const i = a.indexOf(id); if (i >= 0) a.splice(i, 1); };
  S.questions.forEach(q => strip(q.ev));
  S.competitors.forEach(c => strip(c.ev));
  Object.values(S.familyScreen || {}).forEach(r => Object.values(r.criteria).forEach(v => strip(v.ev)));
  S.opportunities.forEach(o => {
    Object.values(o.fields).forEach(fs => Object.values(fs).forEach(v => strip(v.ev)));
    Object.values(o.verdicts).forEach(v => strip(v.ev));
    o.triggers.forEach(t => strip(t.ev)); o.market.factors.forEach(f => strip(f.ev));
    Object.values(o.econ).forEach(f => strip(f.ev)); o.scenarios.forEach(s => strip(s.ev));
  });
  S.evidence = S.evidence.filter(e => e.id !== id);
}

          ${L('implication','Implication','text','What it costs them. Numbers only if they gave them.')}
          ${L('needPayoff','Need-payoff','text','What fixing it would be worth to them')}
          <div><label class="lbl" for="${fid(p+'awareness')}">Problem awareness</label>${sel(p+'awareness', ['Unknown','Low','Medium','High'], i.awareness)}</div>
          <div><label class="lbl" for="${fid(p+'urgency')}">Urgency</label>${sel(p+'urgency', ['Unknown','Low','Medium','High'], i.urgency)}</div>
          ${L('trigger','Trigger event','text')}${L('alternative','Current alternative / workaround','text')}
          ${L('budgetOwner','Who owns the budget?')}${L('buyingProcess','Buying process','text')}
          ${L('priorHelp','Prior outside help? What happened?','text')}${L('paid','What they paid (if disclosed)')}
          ${L('takeaway','Key takeaway','text')}
        </div>
        <div class="stack" style="gap:8px">
          <div class="row" style="justify-content:space-between"><h3 class="sh">Exact customer language</h3><button class="btn sm" data-act="addQuote" data-id="${id}" type="button">Add quote</button></div>
          ${i.quotes.map((q, qi) => `<div class="evcard">
            ${ta(`${p}quotes.${qi}.text`, q.text, 'Their exact words', 2)}
            <div class="row">
              <span class="small muted">Relates to</span>${selInline(`${p}quotes.${qi}.block`, C().blocks.map(b => ({key:b.key,label:b.short})), q.block || 'spin', 'Block')}
              ${q.evId ? `<span class="small muted">Logged as ${q.evId}</span>` : `<button class="btn sm" data-act="quoteToEv" data-id="${id}" data-i="${qi}" type="button">Log as evidence</button>`}
              <button class="btn sm ghost danger" data-act="removeQuote" data-id="${id}" data-i="${qi}" type="button">Remove</button>
            </div></div>`).join('') || '<div class="small muted">No quotes captured yet.</div>'}
        </div>`;
    },
    foot: () => `<button class="btn danger" data-act="deleteInt" data-id="${id}" type="button">Delete interview</button><button class="btn primary" data-act="closeDrawer" type="button">Done</button>`
  };
}
