/* ---------- Actions ---------- */
function toggleIn(arr, v){ const i = arr.indexOf(v); if (i >= 0) arr.splice(i, 1); else arr.push(v); }
const ACTIONS = {
  goto: d => go(d.href),
  closeDrawer: () => closeDrawer(),
  closeAll: () => { DRAWERS.length = 0; renderLayer(); rerenderMainOnly(); },
  print: () => window.print(),
  menu: () => $('#side').classList.toggle('open'),

  openService: d => { const spec = serviceDrawer(d.id); if (d.replace && DRAWERS.length) replaceDrawer(spec); else openDrawer(spec); },
  newService: () => {
    const fam = S.families[0];
    const s = { id: nextServiceId(), familyId: fam ? fam.id : '', name:'New service hypothesis', definition:'', status:'Not Started', evidenceState:'UNKNOWN',
      overlapFlag:false, overlapWith:[], overlapNote:'', related:[], parentId:'', notes:'', pilot:false, created: nowIso() };
    S.services.push(s); Store.save(); openDrawer(serviceDrawer(s.id)); rerenderMainOnly();
  },

  newOpp: d => openDrawer(newOppDrawer(d.svc)),
  newOppFam: d => openDrawer(newOppDrawer('', d.fam)),
  openFamily: d => openDrawer(familyDrawer(d.id)),
  createOpp: () => {
    const x = window._draft;
    if (!x.svc){ toast('Choose a service first'); return; }
    const o = createOpportunity(x.svc, { title: x.title || undefined, statement: x });
    Store.save(); DRAWERS.length = 0; renderLayer(); go('#/opp/' + o.id);
    toast(`${o.id} created with ${qsFor(o.id).length} research questions`);
  },
  deleteOpp: d => {
    if (!confirm(`Delete ${d.id} with its questions? Evidence records are kept and become study-wide.`)) return;
    S.opportunities = S.opportunities.filter(o => o.id !== d.id);
    S.questions = S.questions.filter(q => q.oppId !== d.id);
    S.evidence.forEach(e => { if (e.oppId === d.id) e.oppId = ''; });
    S.interviews.forEach(i => i.oppIds = i.oppIds.filter(x => x !== d.id));
    S.competitors.forEach(c => c.oppIds = c.oppIds.filter(x => x !== d.id));
    Store.save(); go('#/opps');
  },

  showEv: d => openDrawer(evDrawer(d.target)),
  showDim: d => openDrawer(dimDrawer(d.opp, d.dim)),
  linkEv: d => {
    const s = $('#link_' + slug(d.target)); if (!s || !s.value) return;
    const t = evTarget(d.target); if (!t.ids.includes(s.value)) t.ids.push(s.value);
    Store.save(); rerender();
  },
  unlinkEv: d => { const t = evTarget(d.target); const i = t.ids.indexOf(d.id); if (i >= 0) t.ids.splice(i, 1); Store.save(); rerender(); },
  saveEv: d => {
    const x = EV_DRAFT[d.target];
    if (!x || !x.finding.trim()){ toast('Write the finding first'); return; }
    const ev = createEvidence(x);
    const t = evTarget(d.target); if (!t.readonly) t.ids.push(ev.id);
    delete EV_DRAFT[d.target];
    Store.save(); rerender(); toast(`${ev.id} saved and linked`);
  },
  newEv: d => {
    const target = 'new|' + Date.now();
    const oppId = d.opp || (S.opportunities[0] || {}).id || '';
    EV_DRAFT[target] = blankEvDraft({ oppId, block: d.block || 'definition' });
    openDrawer({ eyebrow:'Evidence engine', title:'Add evidence', body: () => {
      const x = EV_DRAFT[target];
      return `<div class="form">
        <div><label class="lbl" for="nev_opp">Hypothesis</label><select id="nev_opp" data-evd="${target}" data-k="oppId">${opts([{key:'',label:'Study-wide'}, ...S.opportunities.map(o => ({key:o.id,label:`${o.id} ${shortTitle(o)}`}))], x.oppId)}</select></div>
        <div><label class="lbl" for="nev_block">Block</label><select id="nev_block" data-evd="${target}" data-k="block">${opts(C().blocks.map(b => ({key:b.key,label:b.label})), x.block)}</select></div>
      </div>` + newEvForm(target);
    }});
  },
  saveNewEv: d => {
    const x = EV_DRAFT[d.target];
    if (!x || !x.finding.trim()){ toast('Write the finding first'); return; }
    const ev = createEvidence(x); delete EV_DRAFT[d.target];
    Store.save(); DRAWERS.pop(); renderLayer(); rerenderMainOnly(); toast(`${ev.id} saved. Link it to a conclusion with Show evidence.`);
  },
  editEv: d => openDrawer(evEditDrawer(d.id)),
  deleteEv: d => {
    const uses = evidenceUses(d.id).length;
    if (!confirm(`Delete ${d.id}?${uses ? ` It supports ${uses} conclusion(s), which will lose this link.` : ''}`)) return;
    removeEvidenceEverywhere(d.id); Store.save(); closeDrawer();
  },

  editQ: d => openDrawer(qDrawer(d.id)),
  addQ: d => {
    const q = { id: nextId('q'), oppId: d.opp, block: d.block || 'definition', bankId:'', text:'New research question', method:'UNKNOWN', priority:'Medium',
      status:'Open', answer:'', basis:'UNKNOWN', ev:[], owner:'', note:'', created: nowIso(), updated:'' };
    S.questions.push(q); Store.save(); openDrawer(qDrawer(q.id)); rerenderMainOnly();
  },
  deleteQ: d => { if (!confirm('Delete this question?')) return; S.questions = S.questions.filter(q => q.id !== d.id); Store.save(); closeDrawer(); },
  markAnswered: d => { const q = S.questions.find(x => x.id === d.id); if (!q) return; if (!q.answer.trim()){ toast('Write the answer first'); return; } q.status = 'Answered'; q.answeredOn = today(); Store.save(); rerender(); toast('Marked answered'); },

  addTrigger: d => {
    const o = oppById(d.opp);
    let ev = '';
    if (!d.custom){ const s = $('#trigLib_' + d.opp); ev = s && s.value; if (!ev){ toast('Pick a trigger from the list'); return; } }
    o.triggers.push({ id: nextId('tr'), event: ev || 'New trigger event', signal:'', state:'Hypothesized', note:'', ev:[] });
    Store.save(); rerender();
  },
  removeTrigger: d => { const o = oppById(d.opp); o.triggers = o.triggers.filter(t => t.id !== d.id); Store.save(); rerender(); },
  addFactor: d => { const o = oppById(d.opp); o.market.factors.push({ id: nextId('f'), l:'New factor', unit:'%', low:'', base:'', high:'', basis:'UNKNOWN', source:'', custom:true, ev:[] }); Store.save(); rerender(); },
  removeFactor: d => { const o = oppById(d.opp); o.market.factors = o.market.factors.filter(f => f.id !== d.id); Store.save(); rerender(); },
  addScenario: d => { const o = oppById(d.opp); o.scenarios.push({ id: nextId('sc'), name:'New scenario', horizon:'', automates:'', price:'', demand:'', remains:'', leverage:'', implication:'', basis:'ASSUMPTION', ev:[] }); Store.save(); rerender(); },
  removeScenario: d => { const o = oppById(d.opp); o.scenarios = o.scenarios.filter(s => s.id !== d.id); Store.save(); rerender(); },
  addStep: d => { const o = oppById(d.opp); o.expansionPath.push({ stage:'', service:'', note:'' }); Store.save(); rerender(); },
  removeStep: d => { const o = oppById(d.opp); o.expansionPath.splice(+d.i, 1); Store.save(); rerender(); },
  toggleTag: d => { const o = oppById(d.opp); toggleIn(o.tags, d.tag); Store.save(); rerender(); },
  toggleCompare: d => {
    const cur = (parseRoute().params.ids || '').split(',').filter(Boolean);
    const all = S.opportunities.map(o => o.id);
    const set = cur.length ? cur : all.slice();
    toggleIn(set, d.id);
    setParam('ids', set.length === all.length ? '' : set.join(','));
  },

  newInt: d => { const i = newInterview(d.opp); Store.save(); openDrawer(intDrawer(i.id)); rerenderMainOnly(); },
  editInt: d => openDrawer(intDrawer(d.id)),
  deleteInt: d => { if (!confirm('Delete this interview? Evidence already logged from it is kept.')) return; S.interviews = S.interviews.filter(i => i.id !== d.id); Store.save(); closeDrawer(); },
  toggleIntOpp: d => { const i = S.interviews.find(x => x.id === d.id); toggleIn(i.oppIds, d.opp); Store.save(); rerender(); },
  addQuote: d => { const i = S.interviews.find(x => x.id === d.id); i.quotes.push({ text:'', block:'spin', evId:'' }); Store.save(); rerender(); },
  removeQuote: d => { const i = S.interviews.find(x => x.id === d.id); i.quotes.splice(+d.i, 1); Store.save(); rerender(); },
  quoteToEv: d => {
    const i = S.interviews.find(x => x.id === d.id); const q = i.quotes[+d.i];
    if (!q.text.trim()){ toast('Write the quote first'); return; }
    if (!i.oppIds.length){ toast('Tick at least one hypothesis for this interview first'); return; }
    const ids = i.oppIds.map(oid => createEvidence({ oppId: oid, block: q.block || 'spin', finding: `"${q.text.trim()}"`, type:'INTERVIEW',
      source: `${i.id} ${i.title || ''}${i.company ? ', ' + i.company : ''}`.trim(), url:'', date: i.date, confidence:'Medium', stance:'Supports', notes:'Logged from interview quote. Review the stance.' }).id);
    q.evId = ids.join(', ');
    Store.save(); rerender(); toast(`Logged as ${q.evId}`);
  },

  newCo: d => { const c = newCompetitor(d.opp); Store.save(); openDrawer(coDrawer(c.id)); rerenderMainOnly(); },
  editCo: d => openDrawer(coDrawer(d.id)),
  deleteCo: d => { if (!confirm('Delete this competitor record?')) return; S.competitors = S.competitors.filter(c => c.id !== d.id); Store.save(); closeDrawer(); },
  toggleCoOpp: d => { const c = S.competitors.find(x => x.id === d.id); toggleIn(c.oppIds, d.opp); Store.save(); rerender(); },
  linkCo: d => { const s = $('#coLink_' + d.opp); if (!s || !s.value) return; const c = S.competitors.find(x => x.id === s.value); if (!c.oppIds.includes(d.opp)) c.oppIds.push(d.opp); Store.save(); rerender(); },

  copyGuide: d => copyText(interviewGuide(oppById(d.opp)).text),
  printGuide: d => {
    const o = oppById(d.opp); const w = window.open('', '_blank');
    if (!w){ toast('Allow pop-ups to print the guide'); return; }
    w.document.write(`<!DOCTYPE html><html><head><meta charset="utf-8"><title>Interview guide ${esc(o.id)}</title><style>body{font:14px/1.6 Georgia,serif;max-width:720px;margin:40px auto;padding:0 20px}h1{font-size:22px}h4{font:600 12px/1 sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#555;margin:20px 0 6px}.why,.small{font-size:12px;color:#777}li{margin:4px 0}</style></head><body><h1>Interview guide: ${esc(o.title)}</h1>${interviewGuide(o).html}</body></html>`);
    w.document.close(); w.focus(); w.print();
  },
  copyBrief: () => copyText(researchBrief()),

  addBankQ: d => {
    const b = blockDef(d.block);
    b.questions.push({ id: `${b.key}-c${Date.now().toString(36)}`, text:'New question', method:'UNKNOWN', priority:'Medium', active:true });
    Store.save(); rerender();
  },
  syncAll: () => {
    let n = 0; S.opportunities.forEach(o => n += syncQuestions(o));
    Store.save(); rerender(); toast(n ? `Added ${n} question(s) to existing hypotheses` : 'Existing hypotheses already have every active question');
  },

  backup: () => { Store.flush(); download(`service-viability-study-${today()}.json`, JSON.stringify(S, null, 1), 'application/json'); },
  exportXlsx: () => exportWorkbook(),
  reset: () => {
    if (!confirm('Erase all research in this browser and start from the original 62 services and 3 pilots?')) return;
    if (!confirm('Last check: have you downloaded a backup?')) return;
    freshState(); Store.flush(); go('#/overview'); toast('Study reset');
  }
};

/* ---------- Excel export ---------- */
function exportWorkbook(){
  if (typeof XLSX === 'undefined'){ alert('The Excel library did not load. Check your connection and reload the page.'); return; }
  const wb = XLSX.utils.book_new();
  const add = (name, rows) => { const ws = XLSX.utils.json_to_sheet(rows.length ? rows : [{ Note:'No records yet' }]);
    const keys = Object.keys(rows[0] || { Note:'' }); ws['!cols'] = keys.map(k => ({ wch: Math.min(60, Math.max(10, k.length + 2, ...rows.slice(0,50).map(r => String(r[k] ?? '').length))) }));
    XLSX.utils.book_append_sheet(wb, ws, name.slice(0,31)); };
  const evT = k => evTypeDef(k).label;
  add('00 Family Screen', S.families.map(f => { const r = familyRec(f.id); const row = { 'Family':f.name, 'Services':S.services.filter(s => s.familyId === f.id).length, 'Buyer':r.buyer, 'Entry Offer':r.entryOffer };
    C().familyCriteria.forEach(c => { const v = r.criteria[c.key]; row[c.label] = v.v; row[c.label + ' Note'] = v.note; row[c.label + ' Basis'] = basisLabel(v.basis); });

    'Evidence State':evT(serviceEvidenceState(s)), 'Pilot':s.pilot?'Yes':'', 'Hypotheses':oppsFor(s.id).map(o => o.id).join(', '), 'Notes':s.notes })));
  add('02 Hypotheses', S.opportunities.map(o => { const p = progress(o); const d = o.fields.definition; return { 'Hypothesis ID':o.id, 'Service ID':o.serviceId, 'Name':o.title, 'Status':o.status, 'Pilot':o.pilot?'Yes':'',

    'Priority':q.priority, 'Status':q.status, 'Owner':q.owner, 'Answer':q.answer, 'Basis':basisLabel(q.basis), 'Evidence IDs':(q.ev||[]).join(', '), 'Notes':q.note })));
  add('05 Evidence Log', S.evidence.map(e => ({ 'Evidence ID':e.id, 'Hypothesis ID':e.oppId, 'Service ID':e.serviceId, 'Evaluation Block':(blockDef(e.block)||{}).label||'', 'Evidence / Finding':e.finding,
    'Evidence Type':evT(e.type), 'Source / Organization':e.source, 'Source URL':e.url, 'Date':e.date, 'Confidence':e.confidence, 'Supports / Challenges':e.stance, 'Researcher Notes':e.notes, 'Used In':evidenceUses(e.id).join(' | ') })));
  add('06 Interviews', S.interviews.map(i => ({ 'Interview ID':i.id, 'Date':i.date, 'Company / Anonymous ID':i.company, 'Industry':i.industry, 'Revenue Band':i.revenue, 'Employees':i.employees, 'B2B/B2C/Hybrid':i.model,
    'Hypotheses':i.oppIds.join(', '), 'Interviewee Title':i.title, 'Situation':i.situation, 'Problem':i.problem, 'Implication':i.implication, 'Need-Payoff':i.needPayoff, 'Problem Awareness':i.awareness, 'Urgency':i.urgency,

  add('08 Market Models', S.opportunities.flatMap(o => { const m = marketCalc(o); return [
    ...o.market.factors.map(f => ({ 'Hypothesis ID':o.id, 'Geography':o.market.geography, 'Line':f.l, 'Unit':f.unit, 'Low':f.low, 'Base':f.base, 'High':f.high, 'Basis':basisLabel(f.basis), 'Source':f.source })),
    { 'Hypothesis ID':o.id, 'Geography':o.market.geography, 'Line':'= Addressable companies', 'Unit':'count', 'Low':m.low?Math.round(m.low.companies):'', 'Base':m.base?Math.round(m.base.companies):'', 'High':m.high?Math.round(m.high.companies):'', 'Basis':'Calculated', 'Source':'' },
    { 'Hypothesis ID':o.id, 'Geography':o.market.geography, 'Line':'= Bottom-up market', 'Unit':'$', 'Low':m.low?Math.round(m.low.value):'', 'Base':m.base?Math.round(m.base.value):'', 'High':m.high?Math.round(m.high.value):'', 'Basis':'Calculated', 'Source':'' }]; }));
  add('09 Economics', S.opportunities.flatMap(o => { const r = econCalc(o); const lab = { value:'Project value', hours:'Delivery hours', rate:'Hourly delivery cost', tools:'Tool cost' };
    return [...Object.entries(o.econ).map(([k, f]) => ({ 'Hypothesis ID':o.id, 'Line':lab[k], 'Low':f.low, 'Base':f.base, 'High':f.high, 'Basis':basisLabel(f.basis), 'Source':f.source })),
      ...[['Delivery cost','cost'],['Gross profit','gp'],['Gross margin %','gm']].map(([l, k]) => ({ 'Hypothesis ID':o.id, 'Line':'= ' + l, ...Object.fromEntries(['low','base','high'].map(s => [s[0].toUpperCase()+s.slice(1), r[s] ? (k==='gm' ? Math.round(r[s].gm*100) : Math.round(r[s][k])) : ''])), 'Basis':'Calculated', 'Source':'' }))]; }));
  add('10 AI Scenarios', S.opportunities.flatMap(o => o.scenarios.map(s => ({ 'Hypothesis ID':o.id, 'Scenario':s.name, 'Horizon':s.horizon, 'What AI Automates':s.automates, 'Price Effect':s.price,
    'Demand Effect':s.demand, 'What Stays Valuable':s.remains, 'Modonix Leverage':s.leverage, 'Implication':s.implication, 'Basis':basisLabel(s.basis) }))));
  add('11 Triggers', S.opportunities.flatMap(o => o.triggers.map(t => ({ 'Hypothesis ID':o.id, 'Trigger ID':t.id, 'Event':t.event, 'Signal':t.signal, 'State':t.state, 'Note':t.note, 'Evidence IDs':(t.ev||[]).join(', ') }))));
  add('12 Decision Matrix', S.opportunities.flatMap(o => C().decisionDims.map(d => { const v = o.verdicts[d.key]; return { 'Hypothesis ID':o.id, 'Hypothesis':o.title, 'Dimension':d.label,
    'Favorability to Modonix':v.fav, 'Confidence':v.conf, 'Rationale':v.rationale, 'Evidence IDs':(v.ev||[]).join(', ') }; })));
  add('13 Methodology', C().blocks.flatMap(b => b.questions.map(q => ({ 'Block':b.label, 'What We Need to Learn':b.learn, 'Why It Matters':b.why, 'Question ID':q.id, 'Question':q.text, 'Default Method':methodDef(q.method).label, 'Priority':q.priority, 'Active':q.active!==false?'Yes':'No' }))));
  XLSX.writeFile(wb, `Modonix_Service_Viability_Study_${today()}.xlsx`);
  toast('Excel export downloaded');
}

/* ---------- Boot ---------- */
function boot(){
  const saved = migrate(Store.backend.load());
  if (saved){ S = saved; initFamilyScreen(); Store.flush(); } else { freshState(); Store.flush(); }
  try {
    const th = localStorage.getItem('svs_theme'); if (th) document.documentElement.dataset.theme = th;
  } catch(e){}
  $('#themeBtn').addEventListener('click', () => {
    const cur = document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    const nx = cur === 'dark' ? 'light' : 'dark';
    document.documentElement.dataset.theme = nx;
    try { localStorage.setItem('svs_theme', nx); } catch(e){}
  });
  $('#menuBtn').addEventListener('click', () => $('#side').classList.toggle('open'));
  window.addEventListener('beforeunload', () => { if (Store.timer) Store.flush(); });
  setSaveState('Saved');
  render(true);
}
boot();

</script>
